# 数据集配置文件（Kaggle "MRI for Brain Tumor with Bounding Boxes"）
# 数据集: https://www.kaggle.com/datasets/ahmedisoroul/mri-for-brain-tumor-with-bounding-boxes
# 5249张MRI图像，4类，已含YOLO格式标注

path: ./data
train: train/images
val: valid/images
test: test/images

# 类别数量
nc: 4

# 类别名称
names:
  0: glioma
  1: meningioma
  2: pituitary
  3: notumor
